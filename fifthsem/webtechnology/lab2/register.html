<!doctype html>
<html>
  <head>
    <title>BookStore - Register</title>
    <style>
      body {
        font-family: Arial;
        margin: 50px;
        background: #f4f4f4;
      }
      .form-container {
        max-width: 400px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
      }
      input[type="submit"] {
        background: #28a745;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
      }
      input[type="submit"]:hover {
        background: #218838;
      }
      a {
        color: #007bff;
      }
      .nav {
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>📝 Registration</h2>
      <form>
        <input type="text" placeholder="Full Name" name="fullname" />
        <input type="email" placeholder="Email" name="email" />
        <input type="text" placeholder="Username" name="username" />
        <input type="password" placeholder="Password" name="password" />
        <input type="tel" placeholder="Phone Number" name="phone" />
        <input type="submit" value="Register" />
      </form>

      <p style="text-align: center">
        <a href="login.html">Already Registered? Login</a>
      </p>
      <div class="nav"><a href="home.html">← Home</a></div>
    </div>
  </body>
</html>
