<!doctype html>
<html>
  <head>
    <title>CSS Demo</title>

    <!-- INTERNAL CSS -->
    <style>
      body {
        font-family: Arial;
        background-image: url("https://seriesgraph.com/_next/image?url=https%3A%2F%2Fimage.tmdb.org%2Ft%2Fp%2Fw400%2FfHpKWq9ayzSk8nSwqRuaAUemRKh.jpg&w=1920&q=75");
        background-repeat: no-repeat;
        background-position: top right; /* FIX overlap */
        margin: 20px;
      }

      h2 {
        font-style: italic;
        color: blue;
        border: 2px solid blue; /* INTERNAL BORDER */
        padding: 5px;
      }

      /* Link Styles */
      a:link {
        color: red;
      }
      a:visited {
        color: purple;
      }
      a:hover {
        color: green;
      }
      a:active {
        color: orange;
      }
    </style>

    <!-- EXTERNAL CSS (simulated) -->
    <style>
      .externalText {
        font-family: Verdana;
        font-size: 18px;
        color: green;
        border: 2px dashed green; /* EXTERNAL BORDER */
        padding: 5px;
      }

      /* Custom cursor */
      a {
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <!-- INLINE CSS -->
    <h1
      style="
        color: darkred;
        font-family: Courier;
        border: 2px solid red;
        padding: 5px;
      "
    >
      Inline CSS Example
    </h1>

    <h2>Internal CSS Example</h2>

    <p class="externalText">This text is styled using external CSS.</p>

    <h3>Background Control</h3>
    <p>
      Image is set to <b>no-repeat</b> and positioned top-right to avoid
      overlap.
    </p>

    <h3>Links with Custom Cursor</h3>
    <a href="#">Click Me</a>
  </body>
</html>
